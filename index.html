      property="og:description"
      content="The personal site of med — a self-taught developer who loves free software, self-hosting, privacy, and making things."
    />
    <meta name="darkreader-lock" />
    <script>
      // Set the theme before first paint to avoid a flash of the wrong theme.
      (() => {
        try {
          const stored = localStorage.getItem("theme");
          const preference = ["light", "dark", "system"].includes(stored) ? stored : "system";
          const dark =
            preference === "dark" ||
            (preference === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          const root = document.documentElement;
          root.dataset.theme = dark ? "dark" : "light";
          root.dataset.themePreference = preference;
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", dark ? "#0a0a0a" : "#fafafa");
        } catch {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
